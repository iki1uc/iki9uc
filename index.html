<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Essenz · 3 → 729 → 40 · GESCHWEISST</title>
<style>body{background:#050805;color:#f2ead1;font-family:ui-monospace,monospace;padding:2em;display:flex;flex-direction:column;gap:1em;max-width:42em;margin:0 auto}h1{font:400 20px Georgia;color:#f2c94c;letter-spacing:.2em;text-align:center;margin:0}button{background:#1e180a;color:#f2c94c;border:1px solid #f2c94c;padding:.7em 1.2em;border-radius:99px;font-family:inherit;font-size:14px;cursor:pointer}button:hover{background:#f2c94c;color:#050805}pre{background:#0a0d08;padding:1em;border-radius:8px;color:#7ee787;font-size:13px;line-height:1.6;min-height:2em;margin:0}.flex{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}label{color:#9cb09b;font-size:11px;letter-spacing:.18em;text-transform:uppercase}input{background:#0a0d08;border:1px solid #2a3a25;color:#f2ead1;padding:.5em;border-radius:6px;font-family:inherit;width:8em;font-size:14px}</style></head>
<body><h1>ESSENZ · 3 → 729 → 40 · GESCHWEISST</h1><label>x eingang</label><div class="flex"><input id="x" type="number" value="729" min="0"><button onclick="down()">↓ runter</button><button onclick="up()">↑ rauf</button><button onclick="ess()">◻ essenz</button></div><label>weg</label><pre id="out">bereit. 3 Tabs -> 1 Wahrheit.</pre><label>gesetz</label><pre>f(f(x)) = f(x)  ·  40 = 1 + 3 + 9 + 27  ·  729/9=81, 81/9=9, 9/3=3</pre>
<script>const E=x=>Math.min(x,40);const W=x=>{let n=0;while(3**(n+1)<=x)n++;return 3**n;};const runter=x=>{let w=[x];while(x>3){x=x%3?W(x-1):x/3;w.push(x);}w.push(40);return w;};const rauf=x=>{let w=[x];while(x<729){x*=3;w.push(x);}w.push(40);return w;};const out=document.getElementById('out'),xin=document.getElementById('x');function down(){out.textContent=runter(+xin.value).join(' → ');}function up(){out.textContent=rauf(+xin.value).join(' → ');}function ess(){out.textContent='essenz('+xin.value+') = '+E(+xin.value);}</script></body></html>
